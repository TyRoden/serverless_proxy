services:
  serverless-proxy:
    build: .
    container_name: serverless-proxy
    ports:
      - "8002:8002"
      - "5001:5001"
    env_file:
      - path: .env
        required: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
    volumes:
      - ./data:/data
    command: >
      sh -c "uvicorn simple_bridge:app --host 0.0.0.0 --port 8002 --reload & flask run --host 0.0.0.0 --port 5001"

networks:
  default: