services:
  runpod-proxy:
    build: .
    container_name: serverless-proxy
    ports:
      - "8002:8002"
      - "5001:5001"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - ai-queue-master_default
    volumes:
      - ./data:/data

networks:
  default:
  ai-queue-master_default:
    external: true
